<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'"><title>Bobee Link</title><link rel="stylesheet" href="/renderer/settings.css"></head>
<body><main><h1>Bobee Link</h1><p>Pair your upload website with this desktop Bobee. Anyone you give the pairing code to can send him art.</p><form id="pair"><label>Website address<input id="url" type="url" placeholder="https://bobee-link.example.workers.dev" required></label><label>Desktop enrollment key<input id="key" type="password" required autocomplete="off"></label><button>Connect this Bobee</button></form><p id="status" role="status"></p><p id="code"></p><button id="revoke" type="button">Disconnect and revoke sender</button><p>Use the tray menu for visits, rest behavior, screen, quiet hours and break reminders.</p></main><script src="/renderer/settings.js"></script></body></html>
